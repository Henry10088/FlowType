[package]
name = "flowtype-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "flowtype"
path = "src/main.rs"

[dependencies]
base64.workspace = true
futures-util.workspace = true
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
mdns-sd.workspace = true
p256.workspace = true
qrcode.workspace = true
rand.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flowtype-core = { path = "../flowtype-core" }
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
windows.workspace = true
windows-numerics.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
winresource = "0.1.31"
