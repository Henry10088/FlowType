name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and lint
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew test lint
      - name: Build Android release APK
        shell: bash
        run: ./gradlew packageFlowTypeRelease
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest

  rust:
    name: Rust tests and clippy
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1-x86_64-pc-windows-msvc
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Windows release
        shell: pwsh
        run: |
          cargo build --workspace --release
          cargo build -p flowtype-tip --release --target i686-pc-windows-msvc
          Copy-Item -LiteralPath "target\i686-pc-windows-msvc\release\flowtype_tip.dll" -Destination "target\release\flowtype_tip_x86.dll" -Force
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $tipHash = (Get-FileHash -LiteralPath "target\release\flowtype_tip.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $tipX86Hash = (Get-FileHash -LiteralPath "target\release\flowtype_tip_x86.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tipHash -notmatch '^[0-9a-f]{64}$') { throw "Invalid TIP DLL SHA-256 hash: $tipHash" }
          if ($tipX86Hash -notmatch '^[0-9a-f]{64}$') { throw "Invalid x86 TIP DLL SHA-256 hash: $tipX86Hash" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DBuildDir="..\windows\target\release" /DTipDllHash=$tipHash /DTipDllX86Hash=$tipX86Hash ..\installer\flowtype.iss
