name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  prepare-lockfiles:
    name: Prepare release runtime lockfiles
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Android release runtime lockfile
        shell: pwsh
        run: pwsh -File scripts/create-android-runtime-lock.ps1 `
          -InputPath android/app/gradle.lockfile `
          -OutputPath gradle.lockfile

      - name: Upload release runtime lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-release-runtime-lockfiles
          if-no-files-found: error
          path: gradle.lockfile

  osv-scan:
    needs: prepare-lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      download-artifact: osv-release-runtime-lockfiles
      scan-args: |-
        --lockfile=windows/Cargo.lock
        --lockfile=gradle.lockfile
