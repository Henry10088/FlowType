name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or publish"
        required: true
        default: "v0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: flowtype-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify release versions
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: pwsh -File scripts/verify-version.ps1 -ExpectedTag "$env:RELEASE_TAG"

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.FLOWTYPE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flowtype-release.jks"
          test -s "$RUNNER_TEMP/flowtype-release.jks"

      - name: Build signed Android APK
        shell: bash
        env:
          FLOWTYPE_ANDROID_KEYSTORE: ${{ runner.temp }}/flowtype-release.jks
          FLOWTYPE_ANDROID_STORE_PASSWORD: ${{ secrets.FLOWTYPE_ANDROID_STORE_PASSWORD }}
          FLOWTYPE_ANDROID_KEY_ALIAS: ${{ secrets.FLOWTYPE_ANDROID_KEY_ALIAS }}
          FLOWTYPE_ANDROID_KEY_PASSWORD: ${{ secrets.FLOWTYPE_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$FLOWTYPE_ANDROID_STORE_PASSWORD"
          test -n "$FLOWTYPE_ANDROID_KEY_ALIAS"
          test -n "$FLOWTYPE_ANDROID_KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew packageFlowTypeRelease

      - name: Verify Android signature and checksum
        shell: bash
        env:
          FLOWTYPE_ANDROID_CERT_SHA256: ${{ vars.FLOWTYPE_ANDROID_CERT_SHA256 }}
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'FlowType-*-android-release.apk' -print -quit)"
          test -n "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual="$($apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$actual"
          if [[ -n "$FLOWTYPE_ANDROID_CERT_SHA256" ]]; then
            expected="$(printf '%s' "$FLOWTYPE_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            test "$actual" = "$expected"
          else
            echo "FLOWTYPE_ANDROID_CERT_SHA256 is not configured; signature validity was verified without certificate pinning."
          fi
          mkdir -p release-metadata
          sha256sum "$apk" | tee release-metadata/FlowType-android-SHA256SUMS.txt

      - name: Upload Android release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/FlowType-*-android-release.apk
            android/release-metadata/FlowType-android-SHA256SUMS.txt

  windows:
    name: Windows signed binaries and installer
    runs-on: windows-2022
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1-x86_64-pc-windows-msvc
          targets: i686-pc-windows-msvc

      - name: Verify release versions
        shell: pwsh
        run: pwsh -File scripts\verify-version.ps1 -ExpectedTag "$env:RELEASE_TAG"

      - name: Build Windows release
        shell: pwsh
        working-directory: windows
        env:
          FLOWTYPE_WINDOWS_CERT_SHA256: ${{ vars.FLOWTYPE_WINDOWS_CERT_SHA256 }}
        run: |
          cargo build --workspace --release
          cargo build -p flowtype-tip --release --target i686-pc-windows-msvc
          Copy-Item -LiteralPath "target\i686-pc-windows-msvc\release\flowtype_tip.dll" -Destination "target\release\flowtype_tip_x86.dll" -Force

      - name: Decode certificate and sign Windows binaries
        shell: pwsh
        env:
          FLOWTYPE_WINDOWS_CERT_BASE64: ${{ secrets.FLOWTYPE_WINDOWS_CERT_BASE64 }}
          FLOWTYPE_WINDOWS_CERT_PASSWORD: ${{ secrets.FLOWTYPE_WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FLOWTYPE_WINDOWS_CERT_BASE64)) { throw "Missing Windows certificate secret" }
          if ([string]::IsNullOrWhiteSpace($env:FLOWTYPE_WINDOWS_CERT_PASSWORD)) { throw "Missing Windows certificate password secret" }

          $pfxPath = Join-Path $env:RUNNER_TEMP "flowtype-authenticode.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:FLOWTYPE_WINDOWS_CERT_BASE64))

          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found" }

          $buildDir = Join-Path $env:GITHUB_WORKSPACE "windows\target\release"
          $targets = @(
            (Join-Path $buildDir "flowtype.exe"),
            (Join-Path $buildDir "flowtype-injector.exe"),
            (Join-Path $buildDir "flowtype_tip.dll"),
            (Join-Path $buildDir "flowtype_tip_x86.dll")
          )
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target)) { throw "Missing Windows release file: $target" }
          }

          # Calculate the TIP identity before Authenticode adds a timestamp.
          # Otherwise an unchanged TIP would get a new filename on every build.
          $tipHash = (Get-FileHash -LiteralPath (Join-Path $buildDir "flowtype_tip.dll") -Algorithm SHA256).Hash.ToLowerInvariant()
          $tipX86Hash = (Get-FileHash -LiteralPath (Join-Path $buildDir "flowtype_tip_x86.dll") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tipHash -notmatch '^[0-9a-f]{64}$') { throw "Invalid TIP DLL SHA-256 hash: $tipHash" }
          if ($tipX86Hash -notmatch '^[0-9a-f]{64}$') { throw "Invalid x86 TIP DLL SHA-256 hash: $tipX86Hash" }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "flowtype-tip-hash.txt") -Value $tipHash -NoNewline -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "flowtype-tip-x86-hash.txt") -Value $tipX86Hash -NoNewline -Encoding ASCII

          $signArgs = @("sign", "/fd", "SHA256", "/f", $pfxPath, "/p", $env:FLOWTYPE_WINDOWS_CERT_PASSWORD, "/tr", "http://timestamp.digicert.com", "/td", "SHA256") + $targets
          & $signTool.FullName @signArgs
          if ($LASTEXITCODE -ne 0) { throw "signtool failed while signing Windows binaries" }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe was not found" }
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "windows\target\release"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "installer\output"
          $tipHashPath = Join-Path $env:RUNNER_TEMP "flowtype-tip-hash.txt"
          $tipX86HashPath = Join-Path $env:RUNNER_TEMP "flowtype-tip-x86-hash.txt"
          if (-not (Test-Path -LiteralPath $tipHashPath)) { throw "TIP DLL hash file was not created before signing" }
          if (-not (Test-Path -LiteralPath $tipX86HashPath)) { throw "x86 TIP DLL hash file was not created before signing" }
          $tipHash = (Get-Content -LiteralPath $tipHashPath -Raw).Trim().ToLowerInvariant()
          $tipX86Hash = (Get-Content -LiteralPath $tipX86HashPath -Raw).Trim().ToLowerInvariant()
          if ($tipHash -notmatch '^[0-9a-f]{64}$') { throw "Invalid TIP DLL SHA-256 hash: $tipHash" }
          if ($tipX86Hash -notmatch '^[0-9a-f]{64}$') { throw "Invalid x86 TIP DLL SHA-256 hash: $tipX86Hash" }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc "/DBuildDir=$buildDir" "/DTipDllHash=$tipHash" "/DTipDllX86Hash=$tipX86Hash" "/O$outputDir" (Join-Path $env:GITHUB_WORKSPACE "installer\flowtype.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign installer and verify signatures
        shell: pwsh
        env:
          FLOWTYPE_WINDOWS_CERT_BASE64: ${{ secrets.FLOWTYPE_WINDOWS_CERT_BASE64 }}
          FLOWTYPE_WINDOWS_CERT_PASSWORD: ${{ secrets.FLOWTYPE_WINDOWS_CERT_PASSWORD }}
          FLOWTYPE_WINDOWS_CERT_SHA256: ${{ vars.FLOWTYPE_WINDOWS_CERT_SHA256 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "flowtype-authenticode.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:FLOWTYPE_WINDOWS_CERT_BASE64))
          $expected = if ([string]::IsNullOrWhiteSpace($env:FLOWTYPE_WINDOWS_CERT_SHA256)) { $null } else { $env:FLOWTYPE_WINDOWS_CERT_SHA256.Replace(":", "").ToLowerInvariant() }
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -Last 1
          $installer = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "installer\output") -Filter "FlowType-*-x64-setup.exe" -File |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          if (-not $installer) { throw "Inno Setup did not produce a FlowType installer" }

          $signArgs = @("sign", "/fd", "SHA256", "/f", $pfxPath, "/p", $env:FLOWTYPE_WINDOWS_CERT_PASSWORD, "/tr", "http://timestamp.digicert.com", "/td", "SHA256", $installer.FullName)
          & $signTool.FullName @signArgs
          if ($LASTEXITCODE -ne 0) { throw "signtool failed while signing the installer" }

          $signedFiles = @(
            (Join-Path $env:GITHUB_WORKSPACE "windows\target\release\flowtype.exe"),
            (Join-Path $env:GITHUB_WORKSPACE "windows\target\release\flowtype-injector.exe"),
            (Join-Path $env:GITHUB_WORKSPACE "windows\target\release\flowtype_tip.dll"),
            (Join-Path $env:GITHUB_WORKSPACE "windows\target\release\flowtype_tip_x86.dll"),
            $installer.FullName
          )
          $metadataDir = Join-Path $env:GITHUB_WORKSPACE "windows\release-metadata"
          New-Item -ItemType Directory -Force -Path $metadataDir | Out-Null
          $signatureLines = foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if (-not $signature.SignerCertificate) { throw "Missing Authenticode signer certificate: $file ($($signature.Status))" }
            $acceptableStatuses = @(
              [System.Management.Automation.SignatureStatus]::Valid,
              # Private release certificates can report UnknownError when the
              # runner cannot build a public trust chain; the signer identity
              # and certificate fingerprint are still checked below.
              [System.Management.Automation.SignatureStatus]::UnknownError
            )
            if ($signature.Status -notin $acceptableStatuses) { throw "Invalid Authenticode signature: $file ($($signature.Status))" }
            $actual = $signature.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
            if ($expected -and $actual -ne $expected) { throw "Unexpected Authenticode certificate: $file" }
            "$file`t$($signature.Status)`t$($signature.SignerCertificate.Subject)"
          }
          $signatureLines | Set-Content -LiteralPath (Join-Path $metadataDir "FlowType-windows-AUTHENTICODE.txt") -Encoding UTF8
          if (-not $expected) { Add-Content -LiteralPath (Join-Path $metadataDir "FlowType-windows-AUTHENTICODE.txt") -Value "Certificate pinning variable not configured; signatures and signer identity were verified." -Encoding UTF8 }
          $hashLines = foreach ($file in $signedFiles) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            "$hash  $file"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $metadataDir "FlowType-windows-SHA256SUMS.txt") -Encoding ASCII

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            windows/target/release/flowtype.exe
            windows/target/release/flowtype-injector.exe
            windows/target/release/flowtype_tip.dll
            windows/target/release/flowtype_tip_x86.dll
            installer/output/FlowType-*-x64-setup.exe
            windows/release-metadata/FlowType-windows-AUTHENTICODE.txt
            windows/release-metadata/FlowType-windows-SHA256SUMS.txt

  publish:
    name: Create GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and verify signed update manifest
        if: steps.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          FLOWTYPE_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.FLOWTYPE_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $windows = @(Get-ChildItem dist -Recurse -File -Filter "FlowType-*-x64-setup.exe")
          $android = @(Get-ChildItem dist -Recurse -File -Filter "FlowType-*-android-release.apk")
          if ($windows.Count -ne 1) { throw "Expected exactly one Windows installer, found $($windows.Count)" }
          if ($android.Count -ne 1) { throw "Expected exactly one signed Android APK, found $($android.Count)" }
          $version = $env:RELEASE_TAG -replace '^v', '' -replace '-.*$', ''
          $gradle = Get-Content android/app/build.gradle.kts -Raw
          $code = [regex]::Match($gradle, '(?m)^\s*versionCode\s*=\s*(\d+)').Groups[1].Value
          pwsh -File scripts/create-update-manifest.ps1 `
            -Tag $env:RELEASE_TAG `
            -Version $version `
            -AndroidVersionCode $code `
            -WindowsInstaller $windows[0].FullName `
            -AndroidApk $android[0].FullName `
            -PublicKey release/update-public-key-spki.b64 `
            -OutputDirectory dist/update

      - name: Create draft GitHub Release, verify assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          mapfile -t assets < <(find dist -type f \( -name '*.apk' -o -name '*-x64-setup.exe' -o -name '*-SHA256SUMS.txt' -o -name '*-AUTHENTICODE.txt' -o -name 'flowtype-update.json' -o -name 'flowtype-update.json.sig' \) -print)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists and will not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi
          args=(release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "FlowType $RELEASE_TAG" --notes "Built, signed, and verified by GitHub Actions." --draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          mapfile -t uploaded < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for required in "flowtype-update.json" "flowtype-update.json.sig"; do
            if [[ "$PRERELEASE" == "false" ]]; then
              printf '%s\n' "${uploaded[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing uploaded asset: $required" >&2; exit 1; }
            fi
          done
          [[ "$(printf '%s\n' "${uploaded[@]}" | grep -c -- '-x64-setup.exe$')" == 1 ]]
          [[ "$(printf '%s\n' "${uploaded[@]}" | grep -c -- '-android-release.apk$')" == 1 ]]
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
